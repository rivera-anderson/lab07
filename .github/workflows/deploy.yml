name: Node.js CI & Render Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Instalar Dependencias
      run: npm install

    - name: Verificar Sintaxis del Servidor
      run: node -c src/server.js

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Notificar Despliegue en Render
      env:
        RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$RENDER_HOOK" ]; then
          curl -X POST "$RENDER_HOOK"
          echo "Webhook de Render ejecutado correctamente."
        else
          echo "Render está configurado para auto-despliegue mediante GitHub."
        fi
